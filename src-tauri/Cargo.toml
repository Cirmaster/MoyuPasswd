[package]
name = "app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Tauri 插件（版本需与 package.json 中 @tauri-apps/plugin-* 保持一致，否则 tauri build 校验失败）
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-biometry = "0.3.0-rc.3"

# 数据库（SQLCipher 加密）
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

# 加密相关
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"

# 工具
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
parking_lot = "0.12"

# Windows API（用于获取全局鼠标位置、系统空闲时间、DPAPI 和凭据管理器）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
